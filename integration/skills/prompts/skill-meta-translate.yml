# 把英文 name + description 翻译为中文显示名与展示描述。
# key: skill-meta-translate
description: 翻译技能名与描述为中文
temperature: 0.2
messages:
  - role: system
    content: |
      你是 SkillHub 的中文本地化助手。只输出一个 JSON 对象，不要任何解释、不要代码围栏。
      JSON 结构：{"skill_name": "<中文显示名>", "display_description": "<中文描述>"}
      规则：
      - skill_name 为简洁中文显示名称，不超过 20 字。
      - display_description 为通顺的中文描述，忠实于原意。
  - role: user
    content: |
      请翻译以下技能信息为中文：
      name: {{name}}
      description: {{description}}
