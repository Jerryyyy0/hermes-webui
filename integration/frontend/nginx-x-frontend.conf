# Hermes WebUI + x_frontend/dist reverse proxy (no backend code changes).
#
# Serves the React SPA from FRONTEND_ROOT and proxies API/SSE to the WebUI
# backend. Browser origin is the nginx listen address (same-origin CSRF OK
# when proxy_set_header Host matches the public host:port).
#
# Defaults (override with envsubst or edit before include):
#   listen:          8080
#   frontend root:   /Users/wzq/Downloads/NLP-PyProject/x_frontend/dist
#   backend:         127.0.0.1:8787
#
# Local skip-login: ngx_http_sub_module rewrites the SPA auth gate so it does
# not redirect to Casdoor (http://192.168.1.139:23008/). See README.md.
#
# Enable (Homebrew nginx):
#   ln -sf "$PWD/integration/frontend/nginx-x-frontend.conf" \
#     /opt/homebrew/etc/nginx/leadnews.conf/hermes-x-frontend.conf
#   nginx -t && nginx -s reload
#
# Open: http://127.0.0.1:8080

upstream hermes_webui_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    root /Users/wzq/Downloads/NLP-PyProject/x_frontend/dist;
    index index.html;

    # Chat / workspace uploads can be large
    client_max_body_size 100M;

    # Shared proxy settings for backend locations
    set $hermes_proxy http://hermes_webui_backend;

    # ── Local skip-login: mock Zhiling identity (no WebUI backend changes) ───
    # Must be before location /api/ so it is not proxied upstream.
    location = /api/integration/webui_login {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"username":"local","display_name":"本地开发","organization":{},"positions":[],"roles":[],"is_admin":true,"ithinktank":{},"ithinktank_account":"","ithinktank_user_id":""}';
    }

    location = /api/integration/webui_logout {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"username":"local","login_url":"/"}';
    }

    # ── Backend: API (includes SSE streams under /api/) ─────────────────────
    location /api/ {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    location = /docs {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    location /extensions/ {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    location /plugins/ {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # ── SPA JS: skip Zhiling SSO gate (local / no-login) ────────────────────
    # x_frontend hardcodes window.location.assign(Rn) → 192.168.1.139:23008.
    # Rewrite at the edge so dist can stay untouched.
    location ~* ^/assets/.*\.js$ {
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        # Do not jump to Casdoor when status === unauthenticated
        sub_filter 'window.location.assign(Rn)' 'void 0';
        # Always mount the main app shell (skip "正在验证登录身份")
        sub_filter 't===`authenticated`?(0,G.jsx)(ne,{})' '!0?(0,G.jsx)(ne,{})';
        # Auth callback / logout fallbacks
        sub_filter 'window.location.replace(Rn)' "window.location.replace('/')";
        sub_filter '`http://192.168.1.139:23008/`' "'/'";

        try_files $uri =404;
        # Avoid sticky browser cache of the pre-rewrite bundle
        expires off;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /pdfjs/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # dist ships a few libs under /static/; fall back to WebUI for the rest
    # (e.g. /static/integration/swagger-ui/*).
    location /static/ {
        try_files $uri @hermes_static;
        expires 1h;
        add_header Cache-Control "public";
    }

    location @hermes_static {
        proxy_pass $hermes_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # ── SPA history fallback + seed local auth session ──────────────────────────
    location / {
        # text/html is already in the default sub_filter_types list
        sub_filter_once on;
        # Seed app_auth_session so the SPA starts verifying against the nginx mock
        # of /api/integration/webui_login (no WebUI backend changes).
        sub_filter '</head>'
            '<script>(function(){try{var k="app_auth_session";if(!localStorage.getItem(k)){localStorage.setItem(k,JSON.stringify({token:"dev-bypass",user:{username:"local",display_name:"本地开发"}}));}}catch(e){}})();</script></head>';
        try_files $uri $uri/ /index.html;
    }
}
