apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes-webui.fullname" . }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "hermes-webui.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
